name: CI

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream only fires on pull_request,
#      which racecar cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together. `chalk:` is the single variable separating
#      the two arms, and `profile:` selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect, contents:
#      read for checkout. Upstream declared no block and ran on the default
#      token; these two are all any remaining job needs.
#   4. A fail-closed assertion on the instrumented arm.
#   5. The windows-latest and macos-15 desktop packaging jobs are removed:
#      observables are gated to linux x86_64/aarch64, and we disable non-Linux
#      runners in this fork. `futu_packaging` was their only consumer, so that
#      change-detection output goes with them.
#   6. Change detection is forced true on workflow_dispatch. dorny/paths-filter
#      has no before-sha on a dispatch, so it falls back to "files in the last
#      commit" -- which would make which jobs run depend on whatever landed
#      last. Racecar needs the same jobs every time. The filter steps still run
#      (they are part of upstream's cost); only the gate is overridden.
#   7. concurrency: dispatched runs get a per-run group. Upstream keys on the
#      ref with cancel-in-progress, which would make the baseline dispatch kill
#      the instrumented one -- both are dispatched on the same ref.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    branches: [main]

run-name: "CI ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

concurrency:
  group: ci-${{ 'pull_request' == 'workflow_dispatch' && github.run_id || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  changes:
    name: 🔎 Change Detection
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ 'pull_request' == 'workflow_dispatch' || steps.backend-filter.outputs.backend_non_web == 'true' || steps.filter.outputs.backend_contract_assets == 'true' || steps.filter.outputs.backend_web_contract == 'true' }}
      docker: ${{ 'pull_request' == 'workflow_dispatch' || steps.filter.outputs.docker == 'true' }}
      frontend: ${{ 'pull_request' == 'workflow_dispatch' || steps.frontend-filter.outputs.frontend_code == 'true' }}
    steps:
      - name: 📥 Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected, so an empty LD_PRELOAD is what
      # SUCCESS looks like from inside the shell. co-hostd daemonizes, so pgrep
      # is no good either. Socket existence is what curiosity's own CI gates on.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: 🧭 Filter paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_contract_assets:
              # These docs and fixtures are executable contracts consumed by
              # offline backend tests, so Markdown/docs-only changes still run them.
              - '{THIRD_PARTY_NOTICES.md,docs/CHANGELOG.md,docs/INDEX.md,docs/INDEX_EN.md,docs/DEPLOY.md,docs/DEPLOY_EN.md,docs/alerts.md,docs/analysis-context-pack.md,docs/decision-signals.md,docs/full-guide.md,docs/full-guide_EN.md,docs/notifications.md,docs/architecture/**,docs/docker/zeabur-deployment.md,tests/fixtures/**}'
            backend_web_contract:
              # Public assets are shared runtime inputs: Python loaders and
              # packaged deployments may consume them outside the Web app.
              - '{apps/dsa-web/public/**,apps/dsa-web/src/components/settings/llmProviderTemplates.ts,apps/dsa-web/src/locales/settingsHelp.ts}'
              - '!**/*.md'
            docker:
              - '{*.py,api/**,bot/**,data_provider/**,src/**,strategies/**,apps/dsa-web/**,docker/**,requirements.txt,.dockerignore,.github/workflows/ci.yml}'
              - '!**/*.md'
      - name: 🧭 Filter backend-safe frontend paths
        id: backend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            backend_non_web:
              - '**'
              - '!apps/dsa-web/**'
              - '!docs/**'
              - '!**/*.md'
              - '!LICENSE'
      - name: 🧭 Filter frontend code paths
        id: frontend-filter
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            frontend_code:
              - 'apps/dsa-web/**'
              - '!**/*.md'

  ai-governance:
    name: ai-governance
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: 🤖 Check AI governance assets
        run: python scripts/check_ai_assets.py

  backend-tests:
    name: backend-tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.backend == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - name: 📥 Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: 🐍 Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/requirements-ci.txt
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          for attempt in 1 2 3; do
            if python -m pip install -r .github/requirements-ci.txt; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Dependency install failed after ${attempt} attempts." >&2
              exit 1
            fi
            echo "Dependency install attempt ${attempt} failed, retrying in 15s..." >&2
            sleep 15
          done
      - name: 🔌 Verify global Futu SDK
        if: matrix.shard == 1
        run: python -c "import futu; print('✅ futu SDK import OK')"
      - name: ✅ Python syntax check
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh syntax
      - name: ✅ Flake8 critical checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh flake8
      - name: ✅ Local deterministic checks
        if: matrix.shard == 1
        run: ./scripts/ci_gate.sh deterministic
      - name: ✅ Offline test suite shard ${{ matrix.shard }}/3
        env:
          PYTEST_SPLITS: '3'
          PYTEST_GROUP: ${{ matrix.shard }}
          PYTEST_FIRST_SHARD_OVERHEAD: '20'
        run: ./scripts/ci_gate.sh offline-tests

  backend-gate:
    name: backend-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance, backend-tests]
    if: always()
    steps:
      - name: ✅ Summarize backend gate
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          AI_GOVERNANCE_RESULT: ${{ needs.ai-governance.result }}
          BACKEND_REQUIRED: ${{ needs.changes.outputs.backend }}
          BACKEND_TESTS_RESULT: ${{ needs.backend-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ] || [ "$AI_GOVERNANCE_RESULT" != "success" ]; then
            echo "Prerequisite failed: changes=$CHANGES_RESULT ai-governance=$AI_GOVERNANCE_RESULT" >&2
            exit 1
          fi
          if [ "$BACKEND_REQUIRED" = "true" ] && [ "$BACKEND_TESTS_RESULT" != "success" ]; then
            echo "Backend shards did not all pass: $BACKEND_TESTS_RESULT" >&2
            exit 1
          fi
          echo "backend-gate passed (required=$BACKEND_REQUIRED, shards=$BACKEND_TESTS_RESULT)"

  docker-build:
    name: docker-build
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.docker == 'true'
    steps:
      - name: 📥 Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: 🛠️ Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      # Upstream caches the image layers in GHA. Left exactly as upstream has
      # it; it must be disabled before any timing comparison, or we would be
      # measuring cache-hit rate rather than instrumentation overhead.
      - name: 🐳 Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: stock-analysis:test
          load: true
          cache-from: type=gha,scope=stock-analysis-ci-docker
          cache-to: type=gha,mode=max,scope=stock-analysis-ci-docker,ignore-error=true
      - name: 🐳 Docker smoke
        run: docker run --rm stock-analysis:test python -c "print('✅ Docker OK')"
      - name: 🔍 Docker smoke imports
        run: |
          docker run --rm stock-analysis:test python -c "
          from src.config import get_config; print('✅ config')
          from src.storage import DatabaseManager; print('✅ storage')
          from src.notification import NotificationService; print('✅ notification')
          from data_provider import DataFetcherManager; print('✅ data_provider')
          from src.analyzer import GeminiAnalyzer; print('✅ analyzer')
          from src.patches.eastmoney_patch import eastmoney_patch; print('✅ patch')
          from bot.dispatcher import CommandDispatcher; print('✅ bot')
          from api.app import app; print('✅ api')
          import futu; print('✅ futu')
          print('✅ All Docker imports OK')
          "

  web-gate:
    name: web-gate
    runs-on: ubuntu-latest
    needs: [changes, ai-governance]
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/dsa-web
    steps:
      - name: 📥 Checkout
        uses: crashappsec/action-checkout@e9ff46a65f6403d9d88b87d248c3dfa41550ec75
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }
      - name: 🟢 Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: apps/dsa-web/package-lock.json
      - name: 📦 Install
        run: npm ci
      - name: 🔎 Lint
        run: npm run lint
      - name: 🏗️ Build
        run: npm run build
